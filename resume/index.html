<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f5f1; color: #1b1a17; font: 15px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
  nav { max-width: 880px; margin: 0 auto; padding: 24px 16px 16px; display: flex; justify-content: space-between; gap: 16px; }
  nav a { color: inherit; text-decoration: underline; text-decoration-color: rgba(27, 26, 23, .3); text-underline-offset: 3px; }
  nav a:hover { text-decoration-color: currentColor; }
  main { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; display: grid; gap: 24px; }
  .page { position: relative; background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 12px 36px -12px rgba(0, 0, 0, .14); overflow: hidden; }
  .page img { display: block; width: 100%; height: auto; }
  .page a { position: absolute; }          /* the clickable contact links over the page image */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media print { nav { display: none; } body { background: #fff; } main { padding: 0; gap: 0; } .page { box-shadow: none; break-after: page; } }
</style>
<script data-goatcounter="https://simoneberhart.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
// analytics events: which row was opened, and which contact or outbound link was clicked (page views come from the tag above)
addEventListener('click', e => {
  const el = e.target.closest?.('a[href], button.open'); if (!el || !window.goatcounter?.count) return;
  let name;
  if (el.matches('button.open')) name = 'open ' + el.closest('[data-item]')?.dataset.item;
  else {
    const u = new URL(el.href, location.href);
    if (u.protocol === 'mailto:') name = 'click email';
    else if (/.pdf$/i.test(u.pathname)) name = 'click pdf ' + u.pathname.split('/').pop();
    else if (u.origin !== location.origin) name = 'click ' + u.hostname.replace(/^www./, '') + (u.hostname.includes('github') || u.hostname.includes('youtube') || u.hostname.includes('printables') ? u.pathname : '');
    else if (/resume/i.test(u.pathname)) name = 'click resume';
  }
  if (name) goatcounter.count({path: name, title: name, event: true});
});
</script>
